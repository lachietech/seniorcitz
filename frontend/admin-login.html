<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="Welcome to the Sandgate Senior Citizens Page - Come and get to know us!" name="description">
  <meta content="Sandgate Senior Citizens, page, senior, sandgate, senior citizens, Sandgate & District Senior Citizens Centre" name="keywords">
  <link rel="icon" href="/static/mainphoto.png" type="image/png">
  <title>Admin Login | Sandgate Seniors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin-login.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg login-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Sandgate Seniors</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#loginNavbar" aria-controls="loginNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="loginNavbar">
        <div class="login-nav-actions ms-auto">
          <a class="nav-link" href="/">View Site</a>
          <a class="powered-by-logo powered-by-mobile" href="https://nielseninnovations.com" target="_blank" rel="noopener noreferrer" aria-label="Powered by Nielsen Innovations">
            <span class="powered-by-text">Powered by</span>
            <span class="powered-by-name">Nielsen Innovations</span>
          </a>
        </div>
      </div>
    </div>
    <a class="powered-by-logo powered-by-desktop" href="https://nielseninnovations.com" target="_blank" rel="noopener noreferrer" aria-label="Powered by Nielsen Innovations">
      <span class="powered-by-text">Powered by</span>
      <span class="powered-by-name">Nielsen Innovations</span>
    </a>
  </nav>

  <main class="login-shell">
    <section class="login-panel">
      <div class="login-card">
        <p class="login-kicker">Admin access</p>
        <h1>Welcome back</h1>
        <p class="login-copy">Sign in to update notices and the weekly timetable.</p>
        <div id="flash-message"></div>

        <form method="POST" action="/admin/login">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-control" required autofocus>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    const flash = document.cookie
      .split('; ')
      .find(row => row.startsWith('flash='))
      ?.split('=')[1];

    if (flash) {
      const alert = document.createElement('div');
      alert.className = 'alert alert-info';
      alert.textContent = decodeURIComponent(flash);
      document.getElementById('flash-message').appendChild(alert);
      document.cookie = 'flash=; Max-Age=0; path=/';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
